services:
  directus:
    environment:
      STORAGE_LOCATIONS: "kodo"
      STORAGE_KODO_DRIVER: "s3"
      STORAGE_KODO_KEY: ${KODO_ACCESS_KEY}
      STORAGE_KODO_SECRET: ${KODO_SECRET_KEY}
      STORAGE_KODO_BUCKET: ${KODO_BUCKET}
      STORAGE_KODO_REGION: ${KODO_REGION}
      STORAGE_KODO_ENDPOINT: ${KODO_S3_ENDPOINT}
      STORAGE_KODO_FORCE_PATH_STYLE: "true"
